org.gradle.daemon=true
org.gradle.jvmargs=-Xms256m -Xmx1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# The editor's own version: ParallaxEditor-X.Y.Z.zip. On develop it ends with -SNAPSHOT; a release branch sets the
# final number (RELEASING.md). It went on from the library's 2.5.0 when the two repositories split, and moves on its own.
version=2.5.0-SNAPSHOT
group=io.github.javakhanstudio

# The library the editor writes pages with (JavaKhanStudio/JKS_Tools2D_ParallaxBackground on Maven Central). A
# -SNAPSHOT on develop, a release before the editor releases: the page format the editor writes is that library's.
parallaxVersion=2.5.0-SNAPSHOT

gdxVersion=1.14.2
visUiVersion=1.5.9
jacksonVersion=2.22.2
