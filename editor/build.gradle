plugins {
    id 'application'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

sourceSets {
    main {
        java.srcDirs = ['src', 'mains']
        // UI skin, fonts and icons are loaded as LibGDX "internal" files, which fall back to the classpath.
        resources.srcDirs = ['assets']
    }
}

dependencies {
    implementation "io.github.javakhanstudio:parallax-background:$parallaxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    implementation "com.kotcrab.vis:vis-ui:$visUiVersion"
    implementation platform("com.fasterxml.jackson:jackson-bom:$jacksonVersion")
    implementation 'com.fasterxml.jackson.core:jackson-databind'
}

// ./gradlew :editor:parallaxSource: which library this build took, the sibling checkout's core (settings.gradle's
// includeBuild) or the jar from Maven Central.
tasks.register('parallaxSource') {
    group = 'help'
    description = 'Prints where parallax-background comes from: the sibling checkout or Maven Central.'
    def root = configurations.runtimeClasspath.incoming.resolutionResult.rootComponent
    doLast {
        def lib = root.get().dependencies
                .collect { it.selected }
                .find { it.moduleVersion?.name in ['parallax-background', 'core'] }
        println "parallax-background: ${lib.id.displayName}"
    }
}

application {
    mainClass = 'jks.tools2d.parallax.Launcher_Editor'
    applicationName = 'ParallaxEditor'
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}

// The editor browses and auto-saves projects under ./Files, so run it from the module directory.
tasks.named('run', JavaExec) {
    workingDir = projectDir
    rootProject.offscreen(it)
}

// The distribution is the "editor + library" download: it carries the sample projects to open on the start screen.
distributions {
    main {
        distributionBaseName = 'ParallaxEditor'
        contents {
            from('Files/Demos') { into 'Files/Demos' }
        }
    }
}
