name: CI

on:
  push:
    branches: [master, develop, 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No library checkout beside this one here: the build takes parallaxVersion from Maven Central (a -SNAPSHOT on
      # develop, from the snapshot repository). The step prints which build of it.
      - name: Build
        run: |
          ./gradlew :editor:parallaxSource
          ./gradlew build --stacktrace

      - name: Check the editor and demo packages
        run: ./gradlew :editor:distZip :demo:distZip

      # A tools/*.sh that opens a window runs it in cage, or says why not (library r171, r175).
      - name: Check no script opens a window outside cage
        run: tools/offscreen-lint.sh && tools/offscreen-lint-test.sh

  # tools/parallax_lab.py's layout lint on pages whose faults were seen full size (r129). It reads only files in git:
  # demo/lab/round1, demo/assets and editor/Files.
  python-tools:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Test the lab's lint
        run: |
          pip install Pillow==12.3.0
          python3 tools/parallax_lab_test.py
