name: Release

# Pushing a tag like v2.5.0 releases that version of the editor: the GitHub release gets ParallaxEditor-X.Y.Z.zip (the
# editor with the library and the sample projects). Nothing goes to Maven Central from here: the library is released
# from JavaKhanStudio/JKS_Tools2D_ParallaxBackground.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Package ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read and check the versions
        id: version
        run: |
          FILE_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          PARALLAX=$(grep '^parallaxVersion=' gradle.properties | cut -d= -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "gradle.properties: $FILE_VERSION, tag: $TAG_VERSION, library: $PARALLAX"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::The tag ($TAG_VERSION) and gradle.properties ($FILE_VERSION) disagree. Bump the version on the release branch first, see RELEASING.md."
            exit 1
          fi
          case "$PARALLAX" in
            *-SNAPSHOT) echo "::error::parallaxVersion is $PARALLAX: a release is built on a released library (RELEASING.md)."; exit 1 ;;
          esac
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "parallax=$PARALLAX" >> "$GITHUB_OUTPUT"
          case "$TAG_VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build and package
        run: |
          ./gradlew build :editor:distZip
          mkdir -p release
          cp editor/build/distributions/ParallaxEditor-*.zip release/
          VERSION="${{ steps.version.outputs.version }}"
          PARALLAX="${{ steps.version.outputs.parallax }}"
          {
            echo "## Download"
            echo
            echo "**Design a parallax** — \`ParallaxEditor-$VERSION.zip\`: the editor with the library ($PARALLAX) and the"
            echo "sample projects. Unzip it and run \`bin/ParallaxEditor\` (\`bin\\ParallaxEditor.bat\` on Windows). Needs"
            echo "Java 17 or newer."
            echo
            echo "The pages it writes are read by parallax-background $PARALLAX and newer: see"
            echo "[the library](https://github.com/JavaKhanStudio/JKS_Tools2D_ParallaxBackground#readme) to use them in a game."
          } > release-notes.md

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: release/*
          body_path: release-notes.md
