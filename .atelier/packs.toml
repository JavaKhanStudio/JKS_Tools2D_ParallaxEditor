# Parallax Editor's TAGS AND THEIR CONTEXT PACKS — split off board 'parallax' on 2026-10-01 (r334).
# Only [tags.<slug>] tables belong in this file.

[tags.editor]
visual = true          # a screen: its close needs a Chose: line (r1559, r1584)
label = "Editor UI"
description = "The VisUI screens, panels, tabs, sliders, buttons and dialogs, and tools/driver-probe.sh that drives them off screen"
color = "#c3a6f0"
sort = 30
context = """
editor/src/jks/tools2d/parallax/editor/: vue/Vue_Selection, vue/Vue_Edition (the two
screens), vue/edition/VE_*.java (the panels), gvars/GVars_UI (skin, fonts, stage),
gvars/GVars_Vue_Edition (state).
COMPILING PROVES NOTHING HERE. The 2019 editor shipped a dialog with empty YES and NO
handlers, buttons with empty listeners or none, radios that only checked themselves.
After wiring a control, use it: tools/driver-probe.sh (after `./gradlew
:editor:installDist`) drives the editor in cage, off Simon's screen.
State is static GVars_*, one project at a time. Panels read the window size when BUILT
and Vue_Edition rebuilds them after a resize: a size cached outside that rebuild goes
stale silently. GVars_UI.init sets VisUI's GLOBAL scaleFactor (0.6) and the layout is
built on it: never set it from a widget.
NEVER MUTATE A SHARED SKIN STYLE: one fontColor change on the default style turned every
label gray. Copy it first (GVars_UI.labelStyle_Second). Nothing in scene2d disposes
itself: fonts GVars_UI.resize regenerates, icon textures and colour pickers (shaders)
all leaked.
EVERY CONTROL HAS A NAME (setName; tabs via driver/Names): the driver and the
presenter's scripts (~/Documents/GitHub/presenter) find controls by it. Name a new one;
a rename breaks them. README.md's "Using the editor" documents every control: fix it in
the commit that changes one.
"""

# Split off from `assets` on 2026-09-12 (doubt d1, decision B). The seam between the two is
# real and runs through Utils_Saving.flattenAndExport -> Utils_TextureAtlas.flattenProject:
# tag a ticket that crosses it with BOTH, which is why each pack names the other.
[tags.project-io]
label = "Project files"
description = "Save, export, autosave, paths, the file chooser, hot reload (a button or dialog of theirs is #editor too)"
color = "#5ec8c0"
sort = 45
context = """
editor/src/jks/tools2d/parallax/editor/: vue/edition/utils/Utils_Saving (save, export,
autosave, pack textures), gvars/EditorPaths (every path decision), vue/edition/data/,
filechooser/, filewatch/FileWatchService + utils/WatchedImage, Vue_Selection (open).
TWO MODELS, NOT ONE FILE: buildWholePageForExport keeps ONLY layers whose image is in
the atlas (the .plax/.jplax a game reads); buildWholePageAsProjectForSaving keeps every
layer, marked in WholePage_Editor.inside. Write one where the other belongs and layers
vanish with no error. SEAM WITH #assets (tag both): export with a loose image flattens
first, and a FAILED flatten must not export (Utils_Saving.flattenAndExport), or the
loose layers drop.
NEVER RESOLVE A SAVED IMAGE PATH BY HAND: EditorPaths.resolveProjectFile does (2019
projects need its working-directory fallback). Autosave (EditorPaths.autoSaveFolder)
stores ABSOLUTE paths, prunes by a regex anchored on this project's prefix, and counts
RENDERED time: no tick while nothing draws.
packTextures and renameOutsideImage move LIVE state too (imageRef urls,
outsideTextureReserve, activeFileWatching) and cancel the old WatchedImage: miss one and
a reload lands on a dead key. One FileWatchService thread watches every image: cancel on
each path change and on close.
Every failure here is reported by a Dialogs call; a silent return swallowed one. Gate:
export a sample from editor/Files in `./gradlew :editor:run` and REOPEN it
(tools/driver-probe.sh).
"""

# #build, #format and #runtime share their names with board parallax's tags, and were copies of
# its packs at the split. Rewritten for this repository (r31): each names what is HERE and sends
# the library's own rules to ../JKS_Tools2D_ParallaxBackground and that board's pack.
[tags.build]
label = "Build & release"
description = "Gradle, CI, dependency versions, the editor's release, the board's action buttons (.atelier/actions.toml)"
color = "#e8938f"
sort = 50
context = """
Here: settings.gradle, build.gradle, gradle.properties, {editor,demo}/build.gradle,
gradle/offscreen.gradle, .github/workflows/{ci,release}.yml, RELEASING.md. The library's
is ../JKS_Tools2D_ParallaxBackground, under board parallax's #build pack.
TWO LIBRARIES CAN BE UNDER YOU. With the library checked out beside this one,
settings.gradle's includeBuild builds its core from source; CI and a fresh clone take
parallaxVersion from Central (a -SNAPSHOT on develop). An editor change that needs an
unpushed library change is green here and red in CI. `./gradlew :editor:parallaxSource`
says which library a build took; `-PparallaxFromCentral` builds as CI does.
build.gradle's cacheChangingModulesFor 0 looks it up every build: CI built a day-old one
(r48).
gradle.properties holds two versions: `version` is the editor's own
(ParallaxEditor-X.Y.Z.zip), `parallaxVersion` the library's: the page format it writes.
Every JavaExec calls rootProject.offscreen(it) or rootProject.headless(it); tools/*.sh
that open a window go through cage. tools/offscreen-lint.sh is the library's copy:
change its rules there first.
Gates, what ci.yml runs on JDK 17, 21 and 25: `./gradlew build`, `./gradlew
:editor:distZip :demo:distZip`, `tools/offscreen-lint.sh &&
tools/offscreen-lint-test.sh`; job python-tools: `python3 tools/parallax_lab_test.py`. A
v* tag runs release.yml: the zip goes to the GitHub release only, nothing to Central.
"""

[tags.format]
label = "File format"
description = ".plax / .jplax / .plaxpj, the Kryo and JSON serializers, back-compat"
color = "#f2b263"
sort = 20
context = """
The format is the library's: the serializers, heart/GVars_Serialization (Kryo),
pages/Json_MixIns and pages/Utils_Page are in ../JKS_Tools2D_ParallaxBackground/core,
and board parallax's #format pack holds their rules (Kryo registration order,
setReferences, version bumps). A change to what a page holds starts there, then the
control here.
The editor's side, under editor/src/jks/tools2d/parallax/editor/:
gvars/GVars_Serialization_Editor (the library's Kryo, one Jackson ObjectMapper),
vue/edition/utils/Utils_Saving (saving_Parallax_Kryo .plax, saving_Parallax_JSON .jplax,
the .plaxpj project), vue/Vue_Selection.selectSingleFile.
SAVE REBUILDS EVERY LAYER FROM THE LIVE ONE: Utils_Saving.modelOf calls the library's
Utils_Page.buildFromPage(layer, ...). A stored field that method does not copy is lost
at the first save in the editor, with no error. A layer whose region has no imageRef
entry is skipped with a log line and nothing else.
The mapper has FAIL_ON_UNKNOWN_PROPERTIES off: a .jplax or .plaxpj written by a newer
library opens with the fields it does not know dropped, silently.
editor/Files/*.plax are the 2019 samples, the library's proof format 1 still loads (it
keeps byte copies in core/test-data/samples). Never re-export or overwrite them.
Gate: open a page with the field, save, export, reopen, diff (tools/driver-probe.sh;
worked examples: tools/r30-empty-layer-probe.txt, tools/r28-sequence-reopen-probe.txt).
The format's own tests are `./gradlew :core:test`, in the library's checkout.
"""

[tags.runtime]
label = "Runtime"
description = "core: scrolling, tiling, cross-fade, the gradient squares"
color = "#8fd0ff"
sort = 10
context = """
The runtime is the library's core:
../JKS_Tools2D_ParallaxBackground/core/src/jks/tools2d/parallax/ (ParallaxPageReader,
ParallaxLayer, heart/Parallax_Heart), and board parallax's #runtime pack holds its rules
and gates (`./gradlew :core:test`, the Godot and jME frame checks). Change it there:
with that checkout beside this one, `./gradlew :editor:run` and `:demo:run` use the
change at once (settings.gradle includeBuild); CI sees it only once the library's
snapshot is published.
Here it is used twice: the editor's preview (vue/Vue_Edition.parallax_Heart, whose
reader's layers Utils_Saving saves) and demo/src.
A PREVIEW AND A REOPENED EXPORT DIFFER BY FILTER, NOT BY PLACE. r22's "layers at a
different horizontal place" was 0 px off: it was the export's MipMapLinearLinear atlas
(#assets). Reopen the export with a Linear atlas before calling it a runtime bug.
See it: `./gradlew :demo:run` (`--args="--page FILE.jplax"` for one page; stills off
screen: tools/demo-shots.sh). `./gradlew :demo:stress` times generated pages and prints
its GPU: cage renders on the NVIDIA one, a desktop window on the Intel one, so compare
numbers of the same.
demo/build.gradle's processResources copies the showcase pages from demo/showcase and
their atlases from editor/Files/transfer and editor/Files/Demos, by file name: rename
one and the demo loses it while the build passes (inferred: Gradle copies a missing
include as nothing).
"""

# #assets moved here at library r133: packing, flatten and export are the editor's code.
[tags.assets]
label = "Images & atlas"
description = "Atlases, packing, flatten, loose PNGs, filtering"
color = "#7fd6a6"
sort = 40
context = """
editor/src/jks/tools2d/parallax/editor/vue/edition/: utils/Utils_TextureAtlas (flatten),
Utils_LoadingImages (dropped PNGs), Utils_Texture, pixmap/PixmapPacker + PixmapPackerIO
(pages written). Core's side: the library board's #assets pack.
Image state is four static maps in gvars/GVars_Vue_Edition: update one alone and it
breaks later, never at the call; Utils_Texture.replaceTexture does all four.
EXPORT IS MIPMAPPED ON PURPOSE (MipMapLinearLinear,Linear, r40): the 50px padding, the
border copied over half of it and bleed exist for it. Nearest to "fix" bleeding deletes
their reason; a 2px border left a seam at every tile join (r53, tools/r53-seam.py).
Pages round up to a power of two: GLES2/WebGL1 draw a mipmapped NPOT page black.
Pixel art (Project_Data.pixelArt) writes Nearest, no mipmaps, no POT; the preview
follows through Utils_Texture.applyPixelArt, which a texture added while it is on must
go through too. Export reads the atlas FILE's filter, never the live texture's.
What the atlas says of a page goes through PixmapPackerIO.pageBody, or the PNG and ETC2
atlases disagree. Same-name regions keep position order only because the guillotine
packer fills its LAST page alone: one that back-fills breaks findLayer. Flatten packs
EVERY region of a name, or the .plax asks for one the new atlas lacks. Pixmaps are
native memory: dispose each.
Seams with #project-io, tag both: export triggers flatten (Position_Infos.fromAtlas
becomes true); hot reload swaps through replaceTexture. Proofs: tools/r114-*, r125-*,
r126-*, r40-*.
"""

